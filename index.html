
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CSV Site with DataTables Test</title>

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

  <!-- jQuery + DataTables JS -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <style>
    body,
    table.dataTable {
      font: 16px/25px system-ui, -apple-system, "Segoe UI", Roboto,
            "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif,
            "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    }
    table.dataTable.compact th,
    table.dataTable.compact td {
      padding: 4px 8px;
    }
    table.dataTable {
      width: 100% !important;
    }
    table.dataTable th input {
      width: 100%;
      box-sizing: border-box;
    }
    table.dataTable th,
    table.dataTable td {
      white-space: normal;
      word-break: break-word;
      vertical-align: top;
    }
  </style>
</head>
<body>


<h2>Interactive Map</h2>


<div style="margin: 40px 0;">
  <iframe
    title="A remote site to drill into the ocean floor"
    aria-label="Locator map"
    id="datawrapper-chart-nJdJc"
    src="https://datawrapper.dwcdn.net/nJdJc/4/"
    scrolling="no"
    frameborder="0"
    style="width: 0; min-width: 100% !important; border: none;"
    height="579"
    data-external="1">
  </iframe>
</div>

<script type="text/javascript">
!function() {
  window.addEventListener("message", function(a) {
    if (void 0 !== a.data["datawrapper-height"]) {
      var e = document.querySelectorAll("iframe");
      for (var t in a.data["datawrapper-height"])
        for (var r, i = 0; r = e[i]; i++)
          if (r.contentWindow === a.source) {
            r.style.height = a.data["datawrapper-height"][t] + "px";
          }
    }
  });
}();
</script>


<h2>CSV DataTable with Multi-Column Filters</h2>

<table id="example" class="display compact" style="width:100%">
  
<thead>
  <tr>
    <th>name</th><th>value</th>
  </tr>
  <tr>
    <th><input type="text" placeholder="Filter"></th><th><input type="text" placeholder="Filter"></th>
  </tr>
</thead>

</table>

<script>
  $(document).ready(function() {
    const data = [["Apples","16"],["Oranges","5"],["Bananas","8"]];

    const table = $('#example').DataTable({
      data: data,
      autoWidth: false,
      paging: true,
      searching: true,
      info: true,
      lengthChange: true,
      orderCellsTop: true,
      columns: [{"title":""},{"title":""}]
    });

    // Apply per-column filtering
    $('#example thead tr:eq(1) th input').each(function(colIndex) {
      $(this).on('keyup change clear', function() {
        table.column(colIndex).search(this.value).draw();
      });
    });

    table.columns.adjust().draw();
  });
</script>

</body>
</html>
